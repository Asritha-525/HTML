<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Book Library</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        function passwordValidation() {
            const password = document.getElementById("password").value;

            if (password.length < 8 ||
                !/[A-Z]/.test(password) ||
                !/[a-z]/.test(password) ||
                !/[0-9]/.test(password) ||
                !/[!@#$%^&*]/.test(password)) {

                alert("Password must be at least 8 characters long, contain at least one uppercase letter, one lowercase letter, one number, and one special character. Please try again.");
                return false;
            }

            alert("Password is valid");
            return true;
        }
    </script>

</head>

<body class="bg-light">

    <header class="bg-primary p-3">
        <div class="container d-flex justify-content-between align-items-center">

            <h2 class="text-white">📚 E-Book Library</h2>

            <nav>
                <ul class="nav">

                    <li class="nav-item">
                        <a href="index1.html" class="nav-link text-white">Home</a>
                    </li>

                    <li class="nav-item">
                        <a href="login1.html" class="nav-link text-white">Login</a>
                    </li>

                    <li class="nav-item">
                        <a href="register1.html" class="nav-link text-white">Register</a>
                    </li>

                    <li class="nav-item">
                        <a href="catalog1.html" class="nav-link text-white">Catalog</a>
                    </li>

                    <li class="nav-item">
                        <a href="cart1.html" class="nav-link text-white">Cart</a>
                    </li>

                </ul>
            </nav>

        </div>
    </header>

    <div class="container mt-5">

        <form class="bg-white p-4 shadow mx-auto" style="max-width: 400px;">

            <h2 class="text-center text-primary mb-4">Login</h2>

            <input type="email"
                   class="form-control mb-3"
                   placeholder="Email">

            <input type="password"
                   id="password"
                   class="form-control mb-3"
                   placeholder="Password">

            <button type="button"
                    class="btn btn-primary w-100"
                    onclick="passwordValidation()">
                Login
            </button>

            <p class="text-center mt-3">
                Not Registered?
                <a href="register.html">Click Here</a>
            </p>

        </form>

    </div>

    <footer class="bg-primary text-white text-center p-3 mt-5">
        © 2026 E-Book Management System
    </footer>

</body>

</html>
